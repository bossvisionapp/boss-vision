<style>
/* Документ для печати в PDF: A3 альбомный, одна страница = один вариант */
@page { size: 420mm 252mm; margin: 0 }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact }
html, body { margin: 0; background: #e9e6e1; font-family: 'Manrope', system-ui, sans-serif; color: #1c1a17 }
.page { width: 420mm; height: 252mm; overflow: hidden; position: relative; page-break-after: always; break-after: page; padding: 16mm 18mm; display: flex; flex-direction: column; gap: 9mm }
.page:last-child { page-break-after: auto }

/* ── обложка ── */
.cover { background: #14110e; color: #f3eadb; justify-content: space-between }
.cover h1 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 92px; line-height: .95; margin: 0; letter-spacing: -.02em; text-transform: uppercase }
.cover .kicker { font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: #c9a86a }
.cover p { max-width: 760px; font-size: 19px; line-height: 1.6; color: #cfc4b3 }
.cover .grid10 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px }
.cover .chip10 { border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.08) }
.cover .chip10 .sw { height: 92px; display: grid; grid-template-rows: 2fr 1fr 1fr }
.cover .chip10 b { display: block; padding: 8px 10px 2px; font-size: 13px }
.cover .chip10 span { display: block; padding: 0 10px 10px; font-size: 10.5px; color: #a89d8c }

/* ── страница варианта ── */
.vhead { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 12mm; align-items: start }
.vnum { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; opacity: .6 }
.vname { font-size: 54px; line-height: 1; margin: 6px 0 10px }
.vtag { font-size: 15px; line-height: 1.55; opacity: .85; max-width: 560px }
.block h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .6; font-family: 'Manrope', sans-serif; font-weight: 700 }
.pal { display: flex; gap: 8px; flex-wrap: wrap }
.pal div { width: 74px }
.pal i { display: block; height: 46px; border-radius: 12px; border: 1px solid rgba(128,128,128,.25) }
.pal small { display: block; font-size: 10px; margin-top: 4px; opacity: .75; font-family: 'Manrope', sans-serif; line-height: 1.3 }
.fonts { display: flex; gap: 18px; align-items: baseline; margin-top: 14px }
.fonts .aa { font-size: 40px; line-height: 1 }
.fonts small { display: block; font-size: 11px; opacity: .7; font-family: 'Manrope', sans-serif }
.why { font-size: 13px; line-height: 1.55; margin: 0; padding-left: 16px }
.why li { margin-bottom: 4px }
.phones { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9mm; flex: 1; min-height: 0 }
.page.dk .ph { box-shadow: 0 0 0 1.5px rgba(255,255,255,.14), 0 30px 60px -28px rgba(0,0,0,.6) }
.cap { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .65; margin-top: 8px; font-family: 'Manrope', sans-serif }

/* ── телефон ── */
.ph { width: 100%; aspect-ratio: 9 / 18.6; border-radius: 42px; padding: 8px; background: #0e0e0e; box-shadow: 0 30px 60px -28px rgba(0,0,0,.45) }
.scr { height: 100%; border-radius: 35px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 11.5px; line-height: 1.35 }
.notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 78px; height: 20px; border-radius: 20px; background: #0e0e0e; z-index: 3 }
.status { display: flex; justify-content: space-between; padding: 10px 20px 4px; font-size: 10px; font-weight: 700; position: relative; z-index: 2 }
.body { padding: 6px 14px 8px; display: grid; gap: 8px; grid-auto-rows: max-content; align-content: start; height: calc(100% - 92px); overflow: hidden }
.dsp { font-family: var(--display); font-weight: var(--dw); letter-spacing: var(--dls); text-transform: var(--dtt) }
.mut { color: var(--muted) }
.card { background: var(--card); border: var(--cardBorder); border-radius: var(--r); padding: 10px; box-shadow: var(--shadow); backdrop-filter: var(--blur) }
.hero { background: var(--hero); color: var(--onHero); border-radius: var(--r); padding: 12px; position: relative; overflow: hidden }
.btn { display: block; text-align: center; background: var(--accent); color: var(--onAccent); border-radius: var(--btnr); padding: 9px; font-weight: 700; font-size: 11px }
.btn.alt { background: var(--accent2); color: var(--onAccent2) }
.chip { display: inline-block; padding: 3px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); font-weight: 700; font-size: 9px; margin: 0 3px 3px 0 }
.chip.ok { background: var(--okSoft); color: var(--ok) }
.chip.on { background: var(--accent); color: var(--onAccent) }
.row { display: flex; align-items: center; gap: 8px }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent2); color: var(--onAccent2); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; flex-shrink: 0 }
.lg { width: 32px; height: 32px; border-radius: calc(var(--r) * .6); background: var(--hero); color: var(--onHero); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; flex-shrink: 0 }
.bar { height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-top: 3px }
.bar i { display: block; height: 100%; background: var(--accent2) }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px }
.tab { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--nav); border-top: var(--cardBorder); padding: 8px 0 14px; font-size: 8.5px; font-weight: 700; color: var(--muted); text-align: center; backdrop-filter: var(--blur) }
.tab span.on { color: var(--ink) }
.tab b { display: block; width: 17px; height: 17px; margin: 0 auto 3px; border-radius: 6px; border: 1.7px solid currentColor }
.tab span.on b { background: var(--accent); border-color: var(--accent) }
.ringtxt { font-family: var(--body); font-weight: 800 }

/* ── финальная страница ── */
table.cmp { width: 100%; border-collapse: collapse; font-size: 13.5px }
table.cmp th, table.cmp td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #d9d2c6; vertical-align: top }
table.cmp th { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #7d7366 }
.dots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #c9a86a; margin-right: 3px }
.dots i.o { background: #d9d2c6 }
</style>
