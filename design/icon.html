<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@700&display=swap" rel="stylesheet">
<style>
/* Иконка приложения 1024×1024 — iOS сам скругляет углы, поэтому фон на весь квадрат */
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#0b0907}
.ic{position:relative;width:1024px;height:1024px;
  background:
    radial-gradient(70% 60% at 78% 12%, rgba(212,173,90,.32), transparent 60%),
    radial-gradient(80% 70% at 10% 100%, rgba(120,84,40,.35), transparent 60%),
    linear-gradient(160deg,#1c1712 0%,#0b0907 60%,#060504 100%)}
.ring{position:absolute;inset:150px;border-radius:50%;border:6px solid transparent;
  background:linear-gradient(140deg,#f7e3a8,#b8913f 45%,#6e5121 70%,#e9cd85) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.9}
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:380px;letter-spacing:-18px;line-height:1;padding-bottom:40px;
  background:linear-gradient(170deg,#fff3cf 0%,#e8c77a 30%,#b8913f 58%,#7a5a24 80%,#e2c27a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.tag{position:absolute;left:0;right:0;bottom:262px;text-align:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:40px;letter-spacing:14px;color:#d4ad5a;opacity:.85;padding-left:16px}
.spark{position:absolute;top:208px;right:268px;width:56px;height:56px;background:linear-gradient(135deg,#fff3cf,#d4ad5a);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
</style></head>
<body><div class="ic"><div class="ring"></div><div class="spark"></div><div class="mono">BV</div><div class="tag">BOSS VISION</div></div></body></html>
